name: AMAN X Android CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 35 and Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;34.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          chmod +x ./gradlew
          rm -f ./local.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Offline Permissions and Debug APK
        run: |
          MERGED_MANIFEST="app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml"
          test -f "$MERGED_MANIFEST"
          if grep -q 'android.permission.INTERNET' "$MERGED_MANIFEST"; then
            echo "ERROR: android.permission.INTERNET leaked into merged manifest!"
            exit 1
          fi
          if grep -q 'android.permission.READ_SMS' "$MERGED_MANIFEST"; then
            echo "ERROR: android.permission.READ_SMS must not exist!"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/*.apk

      - name: Upload Test and Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aman-x-test-and-lint-reports
          if-no-files-found: warn
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
            android/app/build/reports/lint-results-debug.*

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aman-x-debug-apk
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk

